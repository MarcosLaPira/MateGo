<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>MateGo - Inicio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <main class="contenedor">

    <section class="tarjeta">
      <h1>🧉 MateGo</h1>
      <p class="texto-secundario">
        Bienvenido al autoservicio de mates y yerbas. Este sistema te ayuda a armar tu pedido para comprar en el local.
      </p>

      <label for="inputNombre">Ingresá tu nombre para comenzar:</label>
      <input id="inputNombre" type="text" placeholder="Ej: Juan, María..." />

      <button id="btnIrCliente">Ir a la tienda</button>

      <p class="texto-ayuda">
        * Este sistema no cobra online. Solo arma el pedido para la compra en el local.
      </p>

      <a href="admin.html" class="link-admin">Acceso administrador</a>
    </section>
    
  </main>

  <script src="index.js"></script>
</body>
</html>
