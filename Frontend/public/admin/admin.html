<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>MateGo - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta">
      <h1>Panel administrador (demo)</h1>
      <p>Este será el acceso al panel de administración de productos y ventas.</p>

      <form id="formLogin" action="http://localhost:3000/admin/login" method="post">
        <label for="correo">Correo:</label>
        <input id="correo" name="correo" type="email" required>

        <label for="contrasena">Contraseña:</label>
        <input id="contrasena" name="contrasena" type="password" required>

        <button type="submit">Ingresar</button>
      </form>

      <p class="texto-ayuda">
        Más adelante, este HTML se reemplaza por vistas EJS del backend.
      </p>

      <a href="inicio.html" class="link-volver">Volver al inicio</a>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
